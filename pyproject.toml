[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling LLM project"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
    "pydantic>=2.14.2",
    "colorama>=0.4.6",
    "jsonschema>=4.26.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_sdk"]
